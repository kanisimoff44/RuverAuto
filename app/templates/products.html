{% extends "base.html" %}

{% block content %}
<div class="product-container">
  <h2>Подробная информация о продукте</h2>
  {% if product.image_id %}
    <img src="{{ url_for('static', path='images/' + product.image_id|string + '.webp')}}" alt="Фото продукта">
  {% else %}
    <img src="{{ url_for('static', path='images/coming_soon.png')}}" alt="Фото продукта">
  {% endif %}
  <h3>"{{ product.name }}"</h3>
  <p>{{ product.description }}</p>
</div>
{% endblock content %}
